sonar.projectKey=emi-dm_SonarQ-Visualizer
sonar.organization=phd-sdd

# Optional metadata shown in SonarCloud UI
sonar.projectName=SonarQ-Visualizer

# Analyze backend Python code and frontend JavaScript code
sonar.sources=backend/src,frontend/js

# Explicitly mark Python tests so they are not counted as source files
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.py

# Python coverage generated by pytest-cov
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# Frontend currently has no JS coverage report integrated; exclude it from coverage gates
sonar.coverage.exclusions=frontend/**,backend/tests/**

# General analysis exclusions
sonar.exclusions=**/__pycache__/**,**/*.pyc,htmlcov/**,reports/**,data/**

# Encoding of the source code
sonar.sourceEncoding=UTF-8